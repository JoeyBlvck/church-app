[package]
name = "church-flow-desktop"
version = "0.19.0"
description = "The ChurchFlow — desktop wrapper for the local-first church management app"
authors = ["Joey Studios"]
edition = "2021"

[lib]
name = "church_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop auto-update: checks the GitHub release's own latest.json manifest for a newer signed
# build (app/js/updater.js does the checking/prompting from the JS side) and, once the person
# says yes, downloads, verifies its signature, installs it, and relaunches.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
