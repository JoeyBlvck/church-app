<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b27">
<title>The ChurchFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- Inter, per the type spec the user shared. The app is local-first/offline-capable, so this is
     a progressive enhancement, not a dependency: font-display:swap shows the system-font fallback
     immediately, and body's font stack in style.css falls back to it seamlessly if this can't load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
