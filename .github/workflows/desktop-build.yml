name: Build desktop app (Mac + Windows)

# Builds unsigned installers for The ChurchFlow's desktop wrapper (Tauri) on macOS and
# Windows, using GitHub's own hosted runners for each OS — this can't be done from a single
# machine, since a real macOS build needs a real Mac and a real Windows build needs a real PC.
#
# The Mac build targets "universal-apple-darwin" — a single .dmg containing both Apple Silicon
# (arm64) and Intel (x86_64) binaries lipo'd together — rather than whatever chip the runner
# itself happens to be. GitHub's macos-latest runners moved to Apple Silicon hardware, so without
# this the build would silently only run on M-series Macs and fail to even open on an Intel one.
# That needs both Rust targets installed first (rustTargets below); Windows only ever needs the
# one it's already building for, so its rustTargets is empty.
#
# Manual only for now (Actions tab → "Build desktop app (Mac + Windows)" → Run workflow),
# so it doesn't burn CI minutes on every push while this is still early / unsigned. Once
# this is ready for real users, this can be switched to trigger on version tags instead.
#
# Every run publishes its installers to a single rolling GitHub Release tagged "latest" —
# tauri-action creates it on the first run and just replaces its assets on every run after
# that, so the download page (app/download.html) always has one stable set of URLs to link to
# instead of a new one per version. `contents: write` is required for GITHUB_TOKEN to be
# allowed to create/update that release; without it this step fails with a 403.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: mac
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            tauriArgs: --verbose --target universal-apple-darwin
          - platform: windows-latest
            label: windows
            rustTargets: ''
            tauriArgs: --verbose
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Tauri CLI
        run: npm install

      # Every run publishes to the SAME "latest" release (see the big comment at the top of this
      # file), so the version committed in src-tauri/tauri.conf.json never changes on its own --
      # without this step, the updater below would compare each new build against the same old
      # version number and never think there's anything new to offer. Appending the run number
      # (GitHub's own strictly-increasing counter for this workflow) as the patch version gives
      # every run a version newer than the last, with zero chance of forgetting to bump it by
      # hand. This only changes the build's own copy of the file, in the runner -- nothing is
      # committed back to the repo.
      - name: Set this build's version (keeps auto-update comparisons meaningful across builds)
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              cfg = json.load(f)
          base = ".".join(cfg["version"].split(".")[:2])
          cfg["version"] = f"{base}.{os.environ['RUN_NUMBER']}"
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("Building version", cfg["version"])
          PY

      # Signed so the auto-updater (app/js/updater.js) can tell a real update from anything else.
      # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) are the two GitHub Actions secrets set up per
      # src-tauri/UPDATER_SIGNING_SECRETS.txt; includeUpdaterJson makes tauri-action also publish
      # the signed latest.json manifest the updater's tauri.conf.json "endpoints" points at.
      - name: Build the app (signed) and publish it to the "latest" release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: latest
          releaseName: 'The ChurchFlow — latest build'
          releaseBody: 'Automatically built from the latest main branch by the "Build desktop app" workflow. The installer itself is still unsigned by Apple/Microsoft — see the README for what that means the first time you open it — but auto-updates between builds are cryptographically signed and verified.'
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          includeUpdaterJson: true
          args: ${{ matrix.tauriArgs }}
